<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RevTrack fleet operations demo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RevTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RevTrack · Fleet intelligence</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
  <script src="mapbox_bridge.js"></script>
  <style>
    body { margin:0; background:#f5f7fb; }
    .revtrack-marker { width:44px; height:44px; border:3px solid white; border-radius:16px; background:#fff; color:#1764ee; box-shadow:0 5px 18px #18355835; cursor:pointer; font:700 25px system-ui; transition:background .2s,box-shadow .2s; }
    .revtrack-marker.selected { color:white; background:#1764ee; box-shadow:0 0 0 7px #1764ee24,0 5px 18px #18355835; }
    .revtrack-marker.offline { color:#66768b; }
    .revtrack-map-error { position:absolute; bottom:40px; left:12px; right:12px; background:#fff6e6; padding:10px; border-radius:10px; font:12px system-ui; }
    .revtrack-map-loading { position:absolute; z-index:2; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; padding:12px 18px; border-radius:12px; box-shadow:0 6px 24px #18355820; font:12px system-ui; }
    @media (prefers-reduced-motion:reduce) { .revtrack-marker { transition:none; } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
